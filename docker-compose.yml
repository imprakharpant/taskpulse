version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pms-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/pms_db?schema=public
      JWT_SECRET: supersecretproductionjwtkeyhere12345
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data:
